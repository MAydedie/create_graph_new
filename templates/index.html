        function normalizeFrontendNodeType(type) {
            const normalized = String(type || '').trim().toLowerCase();
            if (normalized === 'function' || normalized === 'callable' || normalized === 'method_or_function') return 'method';
            if (normalized === 'field' || normalized === 'parameter' || normalized === 'return_value') return 'variable';
            return normalized;
        }

        function normalizeFrontendRelationType(relation) {
            const normalized = String(relation || '').trim().toLowerCase();
            if (!normalized) return '';
            if (normalized.includes('implements')) return 'implements';
            if (normalized.includes('inherits') || normalized.includes('extends')) return 'inherits';
            if (normalized.includes('calls')) return 'calls';
            if (normalized.includes('accesses') || normalized.includes('uses')) return 'accesses';
            if (normalized.includes('contains') || normalized.includes('defines') || normalized.includes('member_of')) return 'contains';
            return normalized;
        }

        function filterGraphDataForFrontend(graphData) {
            if (!graphData || !Array.isArray(graphData.nodes)) {
                return { nodes: [], edges: [], metadata: graphData?.metadata || {} };
            }

            const nodes = [];
            const nodeIds = new Set();
            graphData.nodes.forEach(node => {
                const data = node?.data || {};
                const nodeId = data.id || node.id;
                const normalizedType = normalizeFrontendNodeType(data.type || node.type);
                if (!nodeId || !FRONTEND_ALLOWED_NODE_TYPES.has(normalizedType)) return;
                nodes.push({
                    ...node,
                    data: {
                        ...data,
                        type: normalizedType,
                    },
                });
                nodeIds.add(nodeId);
            });

            const rawEdges = graphData.edges || graphData.relationships || [];
            const edges = [];
            rawEdges.forEach(edge => {
                const data = edge?.data || edge || {};
                const sourceId = data.source || data.sourceId;
                const targetId = data.target || data.targetId;
                const normalizedRelation = normalizeFrontendRelationType(data.relation || data.type);
                if (!sourceId || !targetId) return;
                if (!nodeIds.has(sourceId) || !nodeIds.has(targetId)) return;
                if (!FRONTEND_ALLOWED_RELATIONS.has(normalizedRelation)) return;
                edges.push({
                    ...edge,
                    data: {
                        ...data,
                        source: sourceId,
                        target: targetId,
                        relation: normalizedRelation,
                        type: normalizedRelation,
                    },
                });
            });

            return {
                ...graphData,
                nodes,
                edges,
                metadata: graphData.metadata || {},
            };
        }

        async function askRagQuestion() {
            if (ragRequestInFlight) {
                return;

            const input = document.getElementById('ragQuestionInput');
            const sendBtn = document.getElementById('ragSendBtn');
            if (!input || !sendBtn) return;

            const queryText = String(input.value || '').trim();
            if (!queryText) {
                return;

            input.value = '';
            pushRagMessage('user', queryText);

            ragRequestInFlight = true;
            sendBtn.disabled = true;
            const pendingMessageId = pushRagMessage('assistant', '正在�?索相关节点与功能�?��，�?稍�??..', { loading: true });

            try {
                const response = await fetch('/api/rag/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(buildRagRequestPayload(queryText)),
                });
                const payload = await response.json();
                if (!response.ok || payload.error) {
                    throw new Error(payload?.error || `HTTP错�?: ${response.status}`);
                }

                removeRagMessageById(pendingMessageId);
                pushRagMessage('assistant', payload.answer || '已完成�?�?��但没有生成回答文�???, {
                    evidence: payload.evidence || [],
                    stats: payload.search?.stats || null,
                });
            } catch (error) {
                removeRagMessageById(pendingMessageId);
                pushRagMessage('assistant', `请求失败�?{error.message}`);
            } finally {
                ragRequestInFlight = false;
                sendBtn.disabled = false;
            }
        }

        function summaryMatchesNode(summary, nodeData) {
            if (!summary || !nodeData) return false;
            const candidates = [
                nodeData.id,
                nodeData.name,
                nodeData.label,
                nodeData.signature,
                nodeData.fqmn,
                nodeData.method_signature,
            ]
                .filter(Boolean)
                .map(item => String(item));
            const methods = (summary.methods || []).map(item => String(item));
            return candidates.some(candidate => methods.includes(candidate) || methods.some(method => method.endsWith(`.${candidate}`)) || candidate.endsWith(`.${method}`));
        }

        function buildStageCSelectionInfo(nodeData) {
            if (!homepageHierarchyContract) {
                return null;
            }

            const partitionSummaries = homepageHierarchyContract?.adapters?.partition_summaries || [];
            const nodeCandidates = nodeData
                ? [nodeData.id, nodeData.name, nodeData.label, nodeData.signature, nodeData.fqmn, nodeData.method_signature].filter(Boolean).map(item => String(item))
                : [];

            const methodKey = nodeCandidates[0] || '';
            let partitionSummary = null;

            if (nodeData) {
                partitionSummary = partitionSummaries.find(item => summaryMatchesNode(item, nodeData)) || null;
            }

            if (!partitionSummary && currentStageCHierarchyPartitionId) {
                partitionSummary = partitionSummaries.find(item => item.partition_id === currentStageCHierarchyPartitionId) || null;
            }

            const processes = (homepageHierarchyContract?.shadow_results?.process?.processes || []).filter(item => {
                const stepMatches = (item.steps || []).some(step => {
                    const signature = String(step.method_signature || '');
                    return nodeCandidates.some(candidate => candidate === signature || signature.endsWith(`.${candidate}`) || candidate.endsWith(`.${signature}`));
                });
                const entryMatch = nodeCandidates.some(candidate => String(item.entry || '') === candidate || String(item.entry || '').endsWith(`.${candidate}`));
                if (partitionSummary && item.partition_id === partitionSummary.partition_id) {
                    return true;
                }
                return stepMatches || entryMatch;
            });

            const communities = (homepageHierarchyContract?.shadow_results?.community?.communities || []).filter(item => {
                const methodMatches = (item.methods || []).some(method => {
                    const methodStr = String(method);
                    return nodeCandidates.some(candidate => candidate === methodStr || methodStr.endsWith(`.${candidate}`) || candidate.endsWith(`.${methodStr}`));
                });
                if (partitionSummary) {
                    return item.partition_id === partitionSummary.partition_id || methodMatches;
                }
                return methodMatches;
            });

            const partitionEntryShadow = partitionSummary
                ? (((homepageHierarchyContract?.shadow_results?.entry_points?.partitions || {})[partitionSummary.partition_id] || {}).effective_entries || [])
                : [];
            const entryShadow = partitionEntryShadow.find(item => {
                const signature = String(item.method_signature || '');
                return nodeCandidates.some(candidate => candidate === signature || signature.endsWith(`.${candidate}`) || candidate.endsWith(`.${signature}`));
            }) || null;

            return {
                methodKey,
                nodeCandidates,
                partitionSummary,
                processes,
                communities,
                partitionEntryShadow,
                entryShadow,
            };
        }

        function findGraphNodeByMethodKey(methodKey) {
            if (!cy || !methodKey) return null;
            const normalized = String(methodKey);
            let matched = null;
            cy.nodes().forEach(node => {
                if (matched) return;
                const data = node.data() || {};
                const candidates = [data.id, data.name, data.label, data.signature, data.fqmn, data.method_signature]
                    .filter(Boolean)
                    .map(item => String(item));
                const hit = candidates.some(candidate => candidate === normalized || candidate.endsWith(`.${normalized}`) || normalized.endsWith(`.${candidate}`));
                if (hit) {
                    matched = node;
                }
            });
            return matched;
        }

        function generateViewData(graphData, view) {
            // 根据视图类型过滤节点和边

            if (view === 'complete') {
                // 综合视图：所有节点和�?                return graphData;
            } else if (view === 'call_graph') {
                // 方法调用图：�?��示方法节点和方法调用关系
                for (let node of graphData.nodes) {
                    if (node.data.type === 'method' || node.data.type === 'function') {
                        filteredNodes.push(node);
                        filteredNodeIds.add(node.data.id);
                    }
                }
                // �?��示calls关系
                for (let edge of graphData.edges) {
                    if (edge.data.relation === 'calls') {
                        if (filteredNodeIds.has(edge.data.source) && filteredNodeIds.has(edge.data.target)) {
                            filteredEdges.push(edge);
                        }
                    }
                }
            } else if (view === 'field_access') {
                // 字�?访问图：显示方法和字�?                for (let node of graphData.nodes) {
                    if (node.data.type === 'method' || node.data.type === 'field') {
                        filteredNodes.push(node);
                        filteredNodeIds.add(node.data.id);
                    }
                }
                // �?��示字段�?�?���?                for (let edge of graphData.edges) {
                    if (edge.data.relation === 'accesses') {
                        if (filteredNodeIds.has(edge.data.source) && filteredNodeIds.has(edge.data.target)) {
                            filteredEdges.push(edge);
                        }
                    }
                }
            } else if (view === 'cross_file') {

                filteredNodes = graphData.nodes;
                for (let node of graphData.nodes) {
                    filteredNodeIds.add(node.data.id);

                // �?��示跨文件调用关系
                for (let edge of graphData.edges) {

                        if (filteredNodeIds.has(edge.data.source) && filteredNodeIds.has(edge.data.target)) {
                            filteredEdges.push(edge);

        function resolveFileTreeEntries(fileTreePayload) {
            const nodes = (fileTreePayload?.nodes || []).filter(item => !!item && !!(item.filePath || item.fullName || item.label));
            const unique = new Map();
            nodes.forEach(item => {
                const rawPath = String(item.filePath || item.fullName || item.label || '').trim();
                if (!rawPath) return;
                const normalized = rawPath.replaceAll('\\', '/');
                if (!unique.has(normalized)) {
                    unique.set(normalized, {
                        id: item.id || normalized,
                        fullPath: normalized,
                        type: item.type || 'file',
                        label: item.label || normalized.split('/').pop() || normalized,
                    });
                }
            });
            return Array.from(unique.values()).sort((a, b) => a.fullPath.localeCompare(b.fullPath));
        }

        function buildFileTreeModel(entries) {
            const root = { name: '__root__', fullPath: '', type: 'root', children: new Map(), meta: null };
            entries.forEach(entry => {
                const parts = entry.fullPath.split('/').filter(Boolean);
                if (parts.length === 0) return;
                let cursor = root;
                let currentPath = '';
                parts.forEach((part, index) => {
                    currentPath = currentPath ? `${currentPath}/${part}` : part;
                    if (!cursor.children.has(part)) {
                        cursor.children.set(part, {
                            name: part,
                            fullPath: currentPath,
                            type: index === parts.length - 1 ? entry.type : 'folder',
                            children: new Map(),
                            meta: index === parts.length - 1 ? entry : null,
                        });
                    }
                    cursor = cursor.children.get(part);
                    if (index === parts.length - 1) {
                        cursor.type = entry.type;
                        cursor.meta = entry;
                    }
                });
            });
            return root;
        }

        function matchGraphNodeByPath(pathValue, preferredType = '') {
            const nodes = allGraphData?.nodes || [];
            const targetPath = normalizeProjectPath(pathValue);
            if (!targetPath) return null;
            let matched = null;
            for (const node of nodes) {
                const data = node?.data || {};
                const nodePath = normalizeProjectPath(data.file || data.full_name || '');
                if (!nodePath) continue;
                if (nodePath === targetPath && (!preferredType || data.type === preferredType)) {
                    matched = node;
                    break;
                }
                if (!matched && (nodePath.endsWith(`/${targetPath}`) || targetPath.endsWith(`/${nodePath}`))) {
                    matched = node;
                }
            }
            return matched;
        }

        function createWorkbenchFileTreeNode(nodeModel) {
            const li = document.createElement('li');
            li.className = 'tree-item';

            const node = document.createElement('div');
            node.className = 'tree-node';
            node.dataset.id = nodeModel.fullPath;

            const icon = document.createElement('span');
            icon.className = 'tree-icon';

            const label = document.createElement('span');
            label.className = 'tree-label';
            label.textContent = nodeModel.name;

            const badge = document.createElement('span');
            badge.className = 'tree-badge';
            badge.textContent = getTypeLabel(nodeModel.type) || nodeModel.type;

            node.appendChild(icon);
            node.appendChild(label);
            node.appendChild(badge);

            const children = document.createElement('ul');
            children.className = 'tree-children';
            children.style.display = 'none';

            const childNodes = Array.from(nodeModel.children.values()).sort((a, b) => {
                const folderBias = (a.type === 'folder' ? 0 : 1) - (b.type === 'folder' ? 0 : 1);
                if (folderBias !== 0) return folderBias;
                return a.name.localeCompare(b.name);
            });

            childNodes.forEach(child => {
                children.appendChild(createWorkbenchFileTreeNode(child));
            });

            if (childNodes.length === 0) {
                node.classList.add('leaf');
            } else {
                li.appendChild(children);
            }

            node.addEventListener('click', (event) => {
                event.stopPropagation();
                if (childNodes.length > 0) {
                    const expanded = node.classList.toggle('expanded');
                    children.style.display = expanded ? 'block' : 'none';
                }

                const matched = matchGraphNodeByPath(nodeModel.fullPath, nodeModel.type);
                if (matched && matched.data) {
                    selectWorkbenchNode(matched.data, {
                        source: 'file-tree',
                        focusGraph: true,
                        fitFocus: false,
                        openDetailForMethod: true,
                        allowToggleNonMethodInGraph: false,
                    });
                }
            });

            li.appendChild(node);
            return li;
        }

        function renderWorkbenchFileTree(fileTreePayload) {
            const tree = document.getElementById('workbenchFileTree');
            if (!tree) return;

            const entries = resolveFileTreeEntries(fileTreePayload);
            if (entries.length === 0) {
                tree.innerHTML = '<li style="padding: 10px; color: #6b7280; font-size: 12px;">暂无文件树数�?/li>';
                return;
            }

            const model = buildFileTreeModel(entries);
            tree.innerHTML = '';
            Array.from(model.children.values())
                .sort((a, b) => a.name.localeCompare(b.name))
                .forEach(child => {
                    tree.appendChild(createWorkbenchFileTreeNode(child));
                });
        }

        function createTreeNode(type, label, data) {
            const li = document.createElement('li');
            li.className = 'tree-item';
            
            const node = document.createElement('div');
            node.className = 'tree-node';
            node.dataset.type = type;
            node.dataset.id = data.id || label;
            
            const icon = document.createElement('span');
            icon.className = 'tree-icon';
            
            const labelSpan = document.createElement('span');
            labelSpan.className = 'tree-label';
            labelSpan.textContent = label;
            
            const badge = document.createElement('span');
            badge.className = 'tree-badge';
            badge.textContent = getTypeLabel(type);
            
            node.appendChild(icon);
            node.appendChild(labelSpan);
            node.appendChild(badge);
            
            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const nodeId = data.id || data.name;

                if (type === 'method' || type === 'function') {
                    selectWorkbenchNode({ ...data, type }, {
                        source: 'tree',
                        focusGraph: true,
                        fitFocus: false,
                        openDetailForMethod: true,
                        allowToggleNonMethodInGraph: false,
                    });
                } else {
                    toggleNode(node, data);

                    if (cy) {
                        const graphNode = cy.getElementById(nodeId);
                        if (graphNode.length > 0) {
                            selectWorkbenchNode(graphNode.data(), {
                                source: 'tree',
                                focusGraph: true,
                                fitFocus: false,
                                openDetailForMethod: false,
                                allowToggleNonMethodInGraph: true,
                            });
                        } else {
                            addNodeToGraph(data);
                            setTimeout(() => {
                                const added = cy ? cy.getElementById(nodeId) : null;
                                if (added && added.length > 0) {
                                    selectWorkbenchNode(added.data(), {
                                        source: 'tree',
                                        focusGraph: true,
                                        fitFocus: false,
                                        openDetailForMethod: false,
                                        allowToggleNonMethodInGraph: true,
                                    });
                                }
                            }, 100);
                        }
                    }
                }
            });
            
            li.appendChild(node);
            
            const children = document.createElement('ul');
            children.className = 'tree-children';
            children.style.display = 'none';
            
            if (type === 'repository' && knowledgeData.packages && knowledgeData.packages.length > 0) {
                knowledgeData.packages.forEach(pkg => {
                    const childNode = createTreeNode('package', pkg.name, pkg);
                    children.appendChild(childNode);
                });
            } else if (type === 'package' && data.classes && Array.isArray(data.classes) && data.classes.length > 0) {
                data.classes.forEach(cls => {
                    const childNode = createTreeNode('class', cls.name, cls);
                    children.appendChild(childNode);
                });
            } else if (type === 'class') {
                if (data.methods && Array.isArray(data.methods) && data.methods.length > 0) {
                    data.methods.forEach(method => {
                        const childNode = createTreeNode('method', method.name, method);
                        children.appendChild(childNode);
                    });
                }
                if (data.fields && Array.isArray(data.fields) && data.fields.length > 0) {
                    data.fields.forEach(field => {
                        const childNode = createTreeNode('field', field.name, field);
                        children.appendChild(childNode);
                    });
                }
            } else if (type === 'method' || type === 'function') {
                if (data.parameters && Array.isArray(data.parameters) && data.parameters.length > 0) {
                    data.parameters.forEach(param => {
                        const childNode = createTreeNode('parameter', param.name, param);
                        children.appendChild(childNode);
                    });
                }
            }
            
            if (children.children.length > 0) {
                li.appendChild(children);
            } else {
                node.classList.add('leaf');
            }
            
            return li;
        }
        
        function toggleNode(node, data) {
            const children = node.nextElementSibling;
            if (!children || children.children.length === 0) {
                // 如果没有子节点，不�?理展�?/折叠
                return;
            }
            
            const isExpanded = node.classList.contains('expanded');
            
            if (isExpanded) {
                // 折叠：隐藏子节点
                node.classList.remove('expanded');
                children.style.display = 'none';
                expandedNodes.delete(node.dataset.id);
            } else {
                // 展开：显示子节点
                node.classList.add('expanded');
                children.style.display = 'block';
                expandedNodes.add(node.dataset.id);
            }
        }

                    nodeData.classes.forEach(cls => {

                            // 添加包到类的连线

                                    target: cls.id

                                    id: method.id,
                                    label: method.name,
                                    type: 'method',
                                    ...method
                                }
                            });
                            
                            // 添加类到方法的连�?                            cy.add({
                                data: {
                                    id: `edge_${nodeId}_${method.id}`,

                                    target: method.id
                                }

                if (nodeData.fields && Array.isArray(nodeData.fields) && nodeData.fields.length > 0) {

                                    id: field.id,
                                    label: field.name,
                                    type: 'field',
                                    ...field
                                }
                            });
                            
                            // 添加类到字�?的连�?                            cy.add({
                                data: {
                                    id: `edge_${nodeId}_${field.id}`,
                                    source: nodeId,
                                    target: field.id
                                }
                            });
                        }
                    });
                }
            } else if (nodeData.type === 'method' || nodeData.type === 'function') {
                // 展开方法/函数：添加参数�?�返回�?��?�CFG、DFG节点和连�?                const methodId = nodeData.id;
                
                // 添加参数节点

                // 添加返回值节�?                if (knowledgeData.return_values && Array.isArray(knowledgeData.return_values)) {

                // 添加CFG节点
                if (knowledgeData.cfgs && Array.isArray(knowledgeData.cfgs)) {

                }
            }

        function collapseGraphNode(nodeId, nodeData) {
            if (!cy) return;
            
            if (nodeData.type === 'repository') {
                // 折叠仓库：移除所有包节点和连�?                if (knowledgeData.packages && knowledgeData.packages.length > 0) {
                    knowledgeData.packages.forEach(pkg => {
                        // 先移除包的所有子节点（类、方法等�?                        collapseGraphNode(pkg.id, pkg);
                        // 移除包节�?                        const pkgNode = cy.getElementById(pkg.id);
                        if (pkgNode.length > 0) {
                            pkgNode.remove();
                        }
                        // 移除连线
                        const edge = cy.getElementById(`edge_${nodeId}_${pkg.id}`);
                        if (edge.length > 0) {
                            edge.remove();
                        }
                        // 从已展开集合�?���?                        graphExpandedNodes.delete(pkg.id);
                    });
                }
            } else if (nodeData.type === 'package') {
                // 折叠包：移除�?有类节点和连�?                if (nodeData.classes && Array.isArray(nodeData.classes) && nodeData.classes.length > 0) {
                    nodeData.classes.forEach(cls => {
                        // 先移除类的所有子节点（方法�?�字段等�?                        collapseGraphNode(cls.id, cls);
                        // 移除类节�?                        const clsNode = cy.getElementById(cls.id);
                        if (clsNode.length > 0) {
                            clsNode.remove();
                        }
                        // 移除连线
                        const edge = cy.getElementById(`edge_${nodeId}_${cls.id}`);
                        if (edge.length > 0) {
                            edge.remove();

        // ==================== KG Schema 蓝图视图 ====================

        function initializeKgSchemaGraph() {
            const container = document.getElementById('cy');

            cy = cytoscape({

        /**
         * 从实际项�?���?��动�?�提�?KG Schema�?         * 1. 定义�?有�?定义的实体类型（包括CFG、DFG、参数�?�返回�?�等�?         * 2. 从数�?��统�?实例数量
         * 3. 定义�?有关系类型和连接模式
         */
        function getKgSchemaElementsFromData(graphData) {
            const predefinedEntityTypes = {
                'class': { label: 'Class\n(�?', group: 'code' },
                'callable': { label: 'Callable\n(函数/方法)', group: 'code' },
                'variable': { label: 'Variable\n(变量)', group: 'code' },
                'interface': { label: 'Interface\n(接口)', group: 'code' }
            };

            const predefinedRelations = [
                { source: 'class', relation: 'contains', target: 'callable' },
                { source: 'class', relation: 'contains', target: 'variable' },
                { source: 'callable', relation: 'calls', target: 'callable' },
                { source: 'class', relation: 'inherits', target: 'class' },
                { source: 'class', relation: 'implements', target: 'interface' },
                { source: 'callable', relation: 'accesses', target: 'variable' }
            ];

            const instanceCounts = {};
            if (graphData && graphData.nodes && Array.isArray(graphData.nodes)) {
                graphData.nodes.forEach(node => {
                    let type = normalizeFrontendNodeType(node.data?.type || node.type || 'unknown');
                    if (type === 'method') {
                        type = 'callable';
                    }
                    instanceCounts[type] = (instanceCounts[type] || 0) + 1;
                });
            }
            
            // 构建 Schema 节点（包�?��有�?定义类型�?            const nodes = [];
            Object.keys(predefinedEntityTypes).forEach(type => {
                const config = predefinedEntityTypes[type];
                const instanceCount = instanceCounts[type] || 0;
                const label = `${config.label}\n[${instanceCount}�?��例]`;
                nodes.push({
                    data: {
                        id: `schema_${type}`,
                        label: label,
                        schemaType: type,
                        group: config.group,
                        instanceCount: instanceCount
                    }
                });
            });
            
            // 构建 Schema 边（包含�?有�?定义关系�?            const edges = [];
            predefinedRelations.forEach(rel => {
                const edgeId = `schema_edge_${rel.source}_${rel.relation}_${rel.target}`;
                edges.push({
                    data: {
                        id: edgeId,
                        source: `schema_${rel.source}`,
                        target: `schema_${rel.target}`,
                        relation: rel.relation.toUpperCase().replace('_', ' '),
                        instanceCount: 0  // �?��从数�?��统�?，但Schema图主要展示类型关�?                    }
                });
            });
            
            console.log(`KG Schema 构建完成: ${nodes.length} 种实体类�? ${edges.length} 种关系连�?);
            console.log('实体类型:', Object.keys(predefinedEntityTypes));
            
            return nodes.concat(edges);
        }
        
        /**
         * KG Schema 视图的样式：颜色和含义与实例视图保持�?致，便于形成“�?��?蓝图”的感�?�?         * 注意：callable 的�?色应该与实例视图�?method/function 的�?色一致�??         */
        function getKgSchemaStyle() {
            return [
                {

                        'height': 90,

                {

                },
                {
                    selector: 'node[schemaType="callable"]',
                    style: {
                        'background-color': '#2ecc71'  // 绿色，与实例视图�?�� method/function 颜色�?�?                    }
                },
                {
                    selector: 'node[schemaType="variable"]',

                        'background-color': '#f39c12'

                {

                {

                        'curve-style': 'bezier',
                        'label': 'data(relation)',

                    }
                }
            ];
        }
        
        /**
         * 更新 KG Schema 视图的统计信�?��基于实际项目数据�?         */
        function updateKgSchemaStats() {
            const entityTypeCounts = {};
            const relationTypeCounts = {};

            if (allGraphData && allGraphData.nodes && Array.isArray(allGraphData.nodes)) {
                allGraphData.nodes.forEach(node => {
                    let type = normalizeFrontendNodeType(node.data?.type || node.type || 'unknown');
                    if (type === 'method') {
                        type = 'callable';
                    }
                    entityTypeCounts[type] = (entityTypeCounts[type] || 0) + 1;
                });
            }

            if (allGraphData && allGraphData.edges && Array.isArray(allGraphData.edges)) {
                allGraphData.edges.forEach(edge => {
                    const relation = normalizeFrontendRelationType(edge.data?.relation || edge.relation || 'unknown');
                    relationTypeCounts[relation] = (relationTypeCounts[relation] || 0) + 1;
                });
            }
            
            const stats = document.getElementById('stats-content');
            if (stats) {
                let html = '<strong>KG Schema（类型级蓝图）：</strong><br>';
                html += '<div style="margin-top:8px; font-size:12px; line-height:1.6;">';
                html += '<p><strong>�?���?��实体类型�?/strong></p>';
                html += '<ul style="margin: 5px 0 10px 20px; padding: 0;">';
                
                // 定义�?有实体类型的标�?（包�??定义的类型）
                const allEntityTypes = {
                    'class': '�?,
                    'callable': '�?���?��函数/方法�?,
                    'variable': '变量',
                    'interface': '接口'
                };
                
                // 显示�?有�?定义的实体类�?                Object.keys(allEntityTypes).forEach(type => {
                    const count = entityTypeCounts[type] || 0;
                    const typeLabel = allEntityTypes[type];
                    html += `<li><strong>${typeLabel}:</strong> ${count} �?���?/li>`;
                });
                
                html += '</ul>';
                html += '<p><strong>�?���?��关系类型�?/strong></p>';
                html += '<ul style="margin: 5px 0 10px 20px; padding: 0;">';
                
                // 定义�?有关系类型的标�?（包�??定义的关系）
                const allRelationTypes = {
                    'contains': '包含',
                    'calls': '调用',
                    'inherits': '继承',
                    'implements': '实现',
                    'accesses': '访问'
                };
                
                // 显示�?有�?定义的关系类�?                Object.keys(allRelationTypes).forEach(relation => {
                    const count = relationTypeCounts[relation] || 0;
                    const relationLabel = allRelationTypes[relation];
                    html += `<li><strong>${relationLabel}:</strong> ${count} 条边</li>`;
                });
                
                html += '</ul>';
                html += '<p style="margin-top:10px; color:#667eea;"><em>💡 点击图中的类型节点，�?���?��对应的实例�?�?/em></p>';
                html += '</div>';
                
                stats.innerHTML = html;
            }
        }
        
        /**
         * KG Schema 视图�?��导航逻辑�?         * 根据�?��击的 schemaType，跳�?��对应的实例�?图，并尽量应用合适的过滤器�??         */
        function handleKgSchemaNavigation(schemaType) {
            if (!schemaType) return;
            
            switch (schemaType) {
                case 'callable':
                    // 跳到方法调用图，并突出可调用实体
                    switchView('call_graph');
                    clearNodeTypeFilter();
                    // 在调用图�?��call_graph 视图�?��就只显示 callable（method/function�?                    break;
                case 'class':
                    // 综合视图 + �?���?                    switchView('complete');
                    clearNodeTypeFilter();
                    toggleNodeTypeFilter('class');
                    break;
                case 'variable':
                    switchView('complete');
                    clearNodeTypeFilter();
                    toggleNodeTypeFilter('variable');
                    break;
                case 'interface':
                    switchView('complete');
                    clearNodeTypeFilter();
                    toggleNodeTypeFilter('interface');
                    break;
                default:
                    // 默�?�?回综合�?�?                    switchView('complete');
                    break;
            }
        }
    </script>
